    <!-- ═══════════════════════════════════════
         STRUCTURED DATA — FAQPage (rich results)
    ═══════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Sopsage?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sopsage is an AI-powered SOP (standard operating procedure) platform that helps ops, compliance, and quality teams write procedures with AI, route them through approval workflows, track whether they're actually followed, and generate audit-ready compliance packages — automatically."
          }
        },
        {
          "@type": "Question",
          "name": "How is Sopsage different from Confluence or Notion?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Confluence and Notion store documents. Sopsage closes the loop — it's the only platform that tracks whether your SOPs are actually followed in the field, detects when steps are skipped (drift detection), and generates compliance evidence automatically. It's process infrastructure, not a wiki."
          }
        },
        {
          "@type": "Question",
          "name": "How is Sopsage different from Process Street or Trainual?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Process Street and Trainual offer checklists and training modules. Sopsage adds AI agents that draft procedures from your meeting transcripts, formal approval queues, semantic Ask AI search over your entire SOP library, drift detection, and full audit trail — the complete lifecycle from first draft to compliance proof."
          }
        },
        {
          "@type": "Question",
          "name": "What does drift detection mean in Sopsage?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Drift detection is Sopsage's ability to identify when team members are skipping steps or deviating from documented procedures. When drift is detected, Sopsage alerts managers and can propose AI-generated fixes — before the gap becomes a compliance risk or incident."
          }
        },
        {
          "@type": "Question",
          "name": "Is Sopsage suitable for SOC2 or ISO compliance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Sopsage maintains a full timestamped audit trail of every draft, approval, and execution. The Compliance Add-On ($199/mo) provides SOC2 and ISO evidence export, control mapping, and auditor-ready packages — making audit readiness a byproduct of daily use rather than a quarterly scramble."
          }
        },
        {
          "@type": "Question",
          "name": "What does Sopsage cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sopsage starts at $49/mo for up to 5 seats (Starter), $149/mo for up to 15 seats (Pro), and $399/mo for up to 50 seats (Business). Enterprise plans start at $1,500/mo with unlimited seats, SSO, and a full DPA. Annual billing saves 20%."
          }
        }
      ]
    }
    </script>
