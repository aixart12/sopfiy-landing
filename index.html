<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary SEO -->
    <title>Sopsage — AI-Powered SOPs, Approvals &amp; Execution Intelligence</title>
    <meta
      name="description"
      content="Sopsage turns scattered procedures into a living system: AI-assisted drafting, Ask AI over your library, meeting transcripts, approval queues, drift detection, and audit-ready analytics — all in one workspace."
    />
    <link rel="canonical" href="https://sopsage.com/" />

    <!-- Open Graph (LinkedIn, Slack, WhatsApp previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sopsage.com/" />
    <meta property="og:title" content="Sopsage — The Operating System for How Organizations Work" />
    <meta
      property="og:description"
      content="The only platform that closes the loop between written procedures and actual execution. AI writing, Ask AI, approvals, drift detection, and compliance analytics in one workspace."
    />
    <meta property="og:image" content="https://sopsage.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Sopsage" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@sopsage" />
    <meta name="twitter:title" content="Sopsage — AI-Powered SOPs &amp; Execution Intelligence" />
    <meta
      name="twitter:description"
      content="From blank page to audit-trail in one place. AI drafting, Ask AI over your library, approvals, and live drift detection — built for teams that can't afford compliance gaps."
    />
    <meta name="twitter:image" content="https://sopsage.com/og-image.png" />

    <!-- Structured data (Google rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Sopsage",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "AI-powered SOP lifecycle platform: draft, review, approve, execute, and analyze standard operating procedures in one workspace. Includes Ask AI, meeting transcript integration, drift detection, and compliance analytics.",
      "url": "https://sopsage.com",
      "offers": [
        {
          "@type": "Offer",
          "name": "Starter",
          "price": "49",
          "priceCurrency": "USD",
          "priceSpecification": { "@type": "UnitPriceSpecification", "billingIncrement": "P1M" }
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "149",
          "priceCurrency": "USD",
          "priceSpecification": { "@type": "UnitPriceSpecification", "billingIncrement": "P1M" }
        },
        {
          "@type": "Offer",
          "name": "Business",
          "price": "399",
          "priceCurrency": "USD",
          "priceSpecification": { "@type": "UnitPriceSpecification", "billingIncrement": "P1M" }
        }
      ],
      "featureList": [
        "AI-assisted SOP drafting",
        "Ask AI over your SOP library",
        "Meeting transcript integration",
        "Approval workflows",
        "Version history and audit trail",
        "SOP execution tracking",
        "Drift detection and alerts",
        "Compliance analytics",
        "Role-based access control",
        "PDF, Word, and HTML export"
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
